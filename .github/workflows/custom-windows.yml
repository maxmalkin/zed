name: Custom Windows Zed
on:
  workflow_dispatch:
  push:
    branches: [latex-preview]
permissions:
  contents: read
concurrency:
  group: custom-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  remote-server:
    if: github.repository == 'maxmalkin/zed'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ZED_RELEASE_CHANNEL: dev
      ZED_UPDATE_EXPLANATION: 'Update this custom build from maxmalkin/zed Actions artifacts.'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_FAST_DEBUG: '0'
      CC: clang
      CXX: clang++
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - run: ./script/linux
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --locked --profile release-fast -p remote_server --target x86_64-unknown-linux-musl
      - run: gzip -c target/x86_64-unknown-linux-musl/release-fast/remote_server > remote_server.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remote-linux-x86_64
          path: remote_server.gz
          if-no-files-found: error
  build:
    if: github.repository == 'maxmalkin/zed'
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      ZED_RELEASE_CHANNEL: dev
      ZED_UPDATE_EXPLANATION: 'Update this custom build from maxmalkin/zed Actions artifacts.'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_FAST_DEBUG: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Configure native build tools
        run: |
          $ErrorActionPreference = 'Stop'
          git config --system core.longpaths true
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'VCINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
          rustup show active-toolchain
      - name: Build portable application
        run: cargo build --locked --profile release-fast -p zed --bin zed-latex
      - name: Install Tectonic and prepare package
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path portable
          Copy-Item target/release-fast/zed-latex.exe portable/
          Copy-Item target/release-fast/conpty.dll portable/
          Copy-Item target/release-fast/OpenConsole.exe portable/
          New-Item -ItemType Directory -Path portable/x64
          Copy-Item target/release-fast/OpenConsole.exe portable/x64/
          $env:GITHUB_SHA | Set-Content portable/BUILD-REVISION.txt
          Invoke-WebRequest 'https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-pc-windows-msvc.zip' -OutFile tectonic.zip
          if ((Get-FileHash tectonic.zip -Algorithm SHA256).Hash.ToLower() -ne 'f61ce51f0b0ade1015b7de7ef368541c5424e9756ecbd0d7af97d6d48030845f') { throw 'Tectonic checksum mismatch' }
          Expand-Archive tectonic.zip -DestinationPath portable
          (Resolve-Path portable).Path >> $env:GITHUB_PATH
          Copy-Item LATEX-BUILD.md portable/README.md
          Copy-Item LICENSE* portable/
          Copy-Item -Recurse crates/markdown_preview/test_data portable/examples
      - name: Test math and preview regressions
        run: |
          cargo test --locked --profile release-fast -p latex_renderer -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --profile release-fast -p markdown --lib math_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --profile release-fast -p repl --lib latex_outputs_
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Zed-LaTeX-Windows-x64
          path: portable/
          if-no-files-found: error
  package:
    needs: [build, remote-server]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Zed-LaTeX-Windows-x64
          path: portable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: remote-linux-x86_64
          path: portable/remote_servers/linux-x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Zed-LaTeX-Windows-x64-with-WSL-SSH
          path: portable/
          if-no-files-found: error
